.mainwrap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.top .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head h1{font-size:26px}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.split{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}

.split>.narrow{flex:1 1 280px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px}
.tile{padding:14px 16px;display:flex;flex-direction:column;gap:3px}

.tile .val{font-family:var(--f-head);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13.5px;text-decoration:none;color:var(--ink);white-space:nowrap}

.in.h[readonly]{background:var(--soft);border-color:transparent}

.calcc{line-height:1.6;font-variant-numeric:tabular-nums;white-space:nowrap}

.csec{padding:16px}.csec h3{font-size:15px;margin-bottom:8px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px;align-items:start}
.cr{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,1.6fr) auto;gap:4px 12px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline;font-variant-numeric:tabular-nums}
.cr:last-child{border-bottom:0}.cr .l{font-weight:500}.cr .h{color:var(--muted);font-size:12.5px}.cr b{text-align:right;white-space:nowrap}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);max-width:100%;box-sizing:border-box;background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);animation:sl .2s ease-out}

function client(n){const b=D.clients.concat(S.xc||[]).find(c=>c.name===n)||{name:n,msp:0,otx:1,dtx:1,terms:30,scomm:0};return Object.assign({},b,S.clients[n]||{})}
function calc(c,t){
  const cl=client(c.client), L=(S.load[c.pt]??20)/100, k=1-cl.msp;
  const [st,ot,hol,on,cb,dt,pto]=t.h;
  const n={st:c.bST*k,ot:c.bOT*k,hol:c.bHol*k,on:c.bOn*k,cb:c.bCb*k};
  const billST=st*n.st, bill=billST+ot*n.ot+hol*n.hol+on*n.on+cb*n.cb+dt*n.hol;
  const payST=st*c.pST, stipAmt=st*c.stip, pay=payST+ot*c.pOT+hol*c.pHol+on*c.pOn+cb*c.pCb+stipAmt;
  const gp=billST-payST*(1+L), adj=gp*(1-cl.scomm/100);
  const rr=(n.st-(c.pST*(1+L)+c.stip))*(1-cl.scomm/100);
  return {bill,billST,pay,payST,stipAmt,gp,adj,gpm:billST?gp/billST*100:0,rr,spread:rr*(st-pto),msp:cl.msp,terms:cl.terms,n,L,hours:st+ot+hol+on+cb+dt};
}

function line(name,wk){const c=C[name],t=S.ts[name+'|'+wk];const r=calc(c,t);return {k:name+'|'+wk,name,wk,c,t,r,due:addD(wk,r.terms),pd:payDate(c,wk,r.terms)}}
function allLines(){const out=[];for(const k in S.ts){const i=k.indexOf('|'),name=k.slice(0,i),wk=k.slice(i+1);if(!C[name])continue;const l=line(name,wk);if(l.r.hours>0||l.t.rcvd)out.push(l)}return out}
function ar(l){
  const bill=l.r.bill;if(bill<=0.004)return null;
  const rc=l.t.rcvd, got=rc?(rc.amt==null?bill:rc.amt):0, bal=Math.max(0,bill-got);
  let st=rc?(bal<=0.01?'Paid':'Short paid'):(l.due<ASOF?'Overdue':'Open');
  return {bill,got,bal,st,late:(st==='Overdue'||st==='Short paid')?Math.max(0,dd(ASOF,l.due)):0};
}
const hasHours=(n,w)=>{const t=S.ts[n+'|'+w];return !!(t&&t.h.some(x=>x>0))};

function commission(mon){
  const wks=WEEKS.filter(w=>w.slice(0,7)===mon);
  const recs=[...new Set(S.cands.map(c=>c.rec))].filter(r=>r&&r!=='Gone').sort();
  return recs.map(R=>{
    const lines=S.cands.filter(c=>c.rec===R).map(c=>{
      const per=wks.map(w=>hasHours(c.name,w)?calc(c,S.ts[c.name+'|'+w]):null);
      const rr=calc(c,{h:[0,0,0,0,0,0,0]}).rr;
      const tenure=Math.round(dd(c.end||ASOF,c.start)/7);
      return {c,per,rr,elig:tenure>=6,tenure};
    }).filter(x=>x.per.some(p=>p));
    const weekTot=wks.map((w,i)=>sum(lines,x=>x.per[i]?x.per[i].spread:0));
    const band=weekTot.map(bandIdx);
    lines.forEach(x=>{x.tier=tierIdx(x.rr);x.weeks=x.per.map((p,i)=>p?{spread:p.spread,rate:D.grid.gp[band[i]][x.tier],comm:x.elig?p.spread*D.grid.gp[band[i]][x.tier]*(S.unit==='pct'?0.01:1):0}:null);
      x.spread=sum(x.weeks,w=>w&&w.spread);x.comm=sum(x.weeks,w=>w&&w.comm)});
    return {R,lines,wks,weekTot,band,spread:sum(lines,x=>x.spread),comm:sum(lines,x=>x.comm)};
  }).filter(r=>r.lines.length);
}

  else if(pm.pay){ch=chart(wks,wks.map(w=>sum(L.filter(l=>l.wk===w),l=>l.r.pay)),wks.map(w=>sum(L.filter(l=>l.wk===w),l=>l.r.payST)),'Total pay','Regular pay')}

  if(pm.bill&&late.length){const top=late.sort((a,b)=>b.a.late-a.a.late)[0];att+=`<div class="att">${pill(late.length+' late','bad')}<div><b>${$m(sum(late,x=>x.a.bal),0)} past due from clients</b><div class="sm-t">Oldest: ${esc(top.l.c.client)} · ${esc(top.l.name)} · ${top.a.late} days late</div><a class="btn sm" href="#invoices" style="margin-top:6px">Review invoices</a></div></div>`}
  if(pm.nav.includes('fte')){const fo=D.fte.filter(fteScope).filter(f=>!S.fte[f.name]&&f.due<ASOF);if(fo.length)att+=`<div class="att">${pill(fo.length+' unpaid','bad')}<div><b>Direct-hire fees overdue: ${$m(sum(fo,f=>f.amount),0)}</b><div class="sm-t">${fo.map(f=>esc(f.name)+' ('+esc(f.client)+')').join(', ')}</div><a class="btn sm" href="#fte" style="margin-top:6px">Open direct hires</a></div></div>`}
  const ending=S.cands.filter(inScope).filter(c=>c.end&&c.end>=addD(ASOF,-30)&&c.end<=addD(ASOF,30));
  if(ending.length)att+=`<div class="att">${pill(ending.length+' ending','warn')}<div><b>Placements ending or just ended</b><div class="sm-t">${ending.map(c=>esc(c.name)+' · '+fd(c.end)).join('<br>')}</div></div></div>`;
  if(pm.margin||r.kind==='rec'){const low=S.cands.filter(inScope).filter(isActive).map(c=>({c,rr:calc(c,{h:[0,0,0,0,0,0,0]}).rr})).filter(x=>x.rr<5);if(low.length)att+=`<div class="att">${pill(low.length+' low margin','warn')}<div><b>Active placements earning under $5/hr</b><div class="sm-t">${low.map(x=>esc(x.c.name)+' · '+$m(x.rr)+'/hr').join('<br>')}</div></div></div>`}
  return head(greet,`Week ending ${fd(LAST_WK)} is the latest week. Here is what needs attention.`)+
   `<div class="grid">${tiles}</div>

V.timesheets=()=>{

  const rows=cs.map(c=>{const k=c.name+'|'+wk,t=S.ts[k],has=hasHours(c.name,wk);const st=!has?(t&&t.status==='draft'?'Draft':'Missing'):(t.status==='approved'?'Approved':'Draft');return {c,k,t,st}}).filter(x=>{const q=(U.tsQ||'').trim().toLowerCase();if(!q)return true;const t=x.t||{};return [x.c.name,x.c.client,x.c.dept,x.c.title,t.tsn,PM().bill?t.invn:''].join(' ').toLowerCase().includes(q)});

    <td><input class="in h tsn ${!ro&&x.st!=='Missing'&&!String(t.tsn||'').trim()?'need':''}" aria-label="Timesheet number for ${esc(x.c.name)}" data-f="tsx" data-p="tsn" data-k="${esc(x.k)}" value="${esc(t.tsn||'')}" placeholder="${ro?'':'TS-'}" ${ro?'readonly':''}></td>
    ${HRS.map(([lab,i])=>`<td><input class="in h ${i===0&&!ro&&x.st!=='Missing'&&!(t.h[0]>0)?'need':''}" inputmode="decimal" aria-label="${lab} hours for ${esc(x.c.name)}" data-f="h" data-k="${esc(x.k)}" data-i="${i}" value="${t.h[i]?t.h[i]:''}" ${ro?'readonly':''}></td>`).join('')}
    <td><input class="in h exp" inputmode="decimal" aria-label="Expense amount for ${esc(x.c.name)}" data-f="tsx" data-p="exp" data-k="${esc(x.k)}" value="${t.exp?t.exp:''}" placeholder="${ro?'':'0.00'}" ${ro?'readonly':''}></td>
    ${pm.bill?`<td><input class="in h tsn" aria-label="Invoice number for ${esc(x.c.name)}" data-f="tsx" data-p="invn" data-k="${esc(x.k)}" value="${esc(t.invn||'')}" placeholder="${pm.editPay?'INV-':''}" ${pm.editPay?'':'readonly'}></td>`:''}
    ${pm.bill?`<td class="n" data-c="bill">${$m(r.bill)}</td>`:''}${pm.pay?`<td class="n" data-c="pay">${$m(r.pay)}</td>`:''}${pm.margin?`<td class="n" data-c="sp">${$m(r.spread)}</td>`:''}
    <td data-c="st">${stPill(x.st)}</td>
    <td>${pm.editHours?(x.st==='Approved'?`<button class="btn sm" data-act="ts-reopen" data-k="${esc(x.k)}">Reopen</button>`:`<button class="btn sm" data-act="ts-approve" data-k="${esc(x.k)}" ${tsReady(x.t)?'':'disabled'} title="Needs a timesheet # and regular hours">Approve</button>`):''}</td></tr>`};
  const tot=totals(shown);
  return head('Timesheets','Enter the timesheet # and hours. Fields marked <b class="req">*</b> are needed before a week can be approved. Rates, MSP fee, pay and due dates fill in by themselves.',
     pm.editHours?`<button class="btn" data-act="ts-copy">Copy last week's hours</button><button class="btn pri" data-act="ts-approve-all">Approve all drafts</button>`:'<span class="pill">View only</span>')+
   `<div class="row"><button class="btn" data-act="ts-wk" data-d="-1" ${wi<=0?'disabled':''} aria-label="Previous week">‹</button>
     <select class="in" style="width:auto" data-f="wk" aria-label="Week ending">${WEEKS.map(w=>`<option value="${w}" ${w===wk?'selected':''}>Week ending Sun ${fd(w)}</option>`).join('')}</select>
     <button class="btn" data-act="ts-wk" data-d="1" ${wi>=WEEKS.length-1?'disabled':''} aria-label="Next week">›</button>
     <input class="in" id="tsq" data-f="tsq" type="search" style="flex:1 1 220px;max-width:300px" placeholder="Search name, client, timesheet #${PM().bill?', invoice #':''}" aria-label="Search timesheets" value="${esc(U.tsQ||'')}">
     <div class="chips">${[['all','All '+rows.length],['missing','Missing '+cnt('Missing')],['draft','Draft '+cnt('Draft')],['approved','Approved '+cnt('Approved')]].map(([k,l])=>`<button class="chip ${U.tsF===k?'on':''}" data-act="ts-f" data-v="${k}">${l}</button>`).join('')}</div></div>
   <div class="split"><div class="card wide tbl"><table><thead><tr><th>Contractor</th><th>Timesheet #${RQ_}</th>${HRS.map(h=>`<th>${h[0]}${h[1]===0?RQ_:''}</th>`).join('')}<th>Expense $</th>${pm.bill?'<th>Invoice #</th>':''}${pm.bill?'<th class="n">Bill $</th>':''}${pm.pay?'<th class="n">Pay $</th>':''}${pm.margin?'<th class="n">Spread $</th>':''}<th>Status</th><th></th></tr></thead>
   <tbody>${shown.map(tr).join('')||`<tr><td colspan="12" class="empty">${U.tsQ?'No timesheets match “'+esc(U.tsQ)+'” for this week.':'No placements match this filter for this week.'}</td></tr>`}</tbody>
   <tfoot><tr><td>Week total</td><td></td><td class="n" id="t-h" colspan="7" style="text-align:left">${$n(tot.h)} hours</td><td class="n" id="t-e">${$m(tot.e)}</td>${pm.bill?'<td></td>':''}${pm.bill?`<td class="n" id="t-b">${$m(tot.b)}</td>`:''}${pm.pay?`<td class="n" id="t-p">${$m(tot.p)}</td>`:''}${pm.margin?`<td class="n" id="t-s">${$m(tot.s)}</td>`:''}<td colspan="2"></td></tr></tfoot></table></div>
   <aside class="card pad narrow" id="ts-x">${explain()}</aside></div>`;
};
function totals(rows){let h=0,b=0,p=0,s=0,e=0;rows.forEach(x=>{const t=S.ts[x.k];if(!t)return;const r=calc(x.c,t);h+=r.hours+t.h[6];b+=r.bill;p+=r.pay;s+=r.spread;e+=+t.exp||0});return {h,b,p,s,e}}
function explain(){
  const k=U.tsSel;if(!k)return '<div class="empty">Pick a row to see how it is worked out.</div>';
  const i=k.indexOf('|'),name=k.slice(0,i),wk=k.slice(i+1),c=C[name],t=S.ts[k]||{h:[0,0,0,0,0,0,0]},r=calc(c,t),pm=PM();
  const [st,ot,hol,on,cb]=t.h;let h=`<h2 style="font-size:16px">How this row is worked out</h2><div class="sm-t" style="margin:2px 0 10px">${esc(name)} · ${esc(c.client)} · week ending ${fd(wk)}</div><div class="math"><div><span>Timesheet #</span><span>${t.tsn?esc(t.tsn):'<span class="err">missing</span>'}</span></div>${pm.bill?`<div><span>Invoice #</span><span>${t.invn?esc(t.invn):'<span class="mut">not invoiced yet</span>'}</span></div>`:''}${t.exp?`<div><span>Expense (recorded, not added to the bill, as in sheet)</span><span>${$m(+t.exp)}</span></div>`:''}<div style="height:8px"></div>`;
  if(pm.bill){h+=`<div><span>${$n(st)} h × ${$m(c.bST)} less ${(r.msp*100).toFixed(2)}% MSP</span><span>${$m(st*r.n.st)}</span></div>`;
    if(ot)h+=`<div><span>${$n(ot)} h overtime × ${$m(r.n.ot)}</span><span>${$m(ot*r.n.ot)}</span></div>`;if(hol)h+=`<div><span>${$n(hol)} h holiday × ${$m(r.n.hol)}</span><span>${$m(hol*r.n.hol)}</span></div>`;
    if(on)h+=`<div><span>${$n(on)} h on-call × ${$m(r.n.on)}</span><span>${$m(on*r.n.on)}</span></div>`;if(cb)h+=`<div><span>${$n(cb)} h call-back × ${$m(r.n.cb)}</span><span>${$m(cb*r.n.cb)}</span></div>`;if(t.h[5])h+=`<div><span>${$n(t.h[5])} h double time × ${$m(r.n.hol)} (holiday rate, as in sheet)</span><span>${$m(t.h[5]*r.n.hol)}</span></div>`;
    h+=`<div class="tot"><span>Bill to ${esc(c.client)}</span><span>${$m(r.bill)}</span></div><div><span>Invoice due (${r.terms} days)</span><span>${fd(addD(wk,r.terms))}</span></div><div style="height:8px"></div>`}
  if(pm.pay){h+=`<div><span>${$n(st)} h × ${$m(c.pST)} pay</span><span>${$m(r.payST)}</span></div>`;if(ot)h+=`<div><span>${$n(ot)} h overtime × ${$m(c.pOT)}</span><span>${$m(ot*c.pOT)}</span></div>`;
    if(on)h+=`<div><span>${$n(on)} h on-call × ${$m(c.pOn)}</span><span>${$m(on*c.pOn)}</span></div>`;if(c.stip)h+=`<div><span>${$n(st)} h × ${$m(c.stip)} stipend</span><span>${$m(r.stipAmt)}</span></div>`;
    h+=`<div class="tot"><span>Pay to ${esc(name.split(' ')[0])}</span><span>${$m(r.pay)}</span></div><div><span>Pay date</span><span>${fd(payDate(c,wk,r.terms))}</span></div><div style="height:8px"></div>`}
  if(pm.margin){h+=`<div><span>Profit per hour</span><span>${$m(r.rr)}</span></div><div><span>Weekly spread (× ${$n(st-t.h[6])} h)</span><span>${$m(r.spread)}</span></div><div><span>Gross profit, sheet rule</span><span>${$m(r.gp)} · ${pct(r.gpm)}</span></div>`;
    if(c.stip)h+=`<div class="note" style="margin-top:8px">The sheet's gross profit leaves out the ${$m(r.stipAmt)} stipend. Spread includes it.</div>`}
  return h+'</div>';
}

const PEOPLE=['Nathan','John','Bidya','Abhinav','Ravi','Bhupendra','Monu','Ritika'];

function plFilters(){return `<label class="fld" style="flex:1 1 240px;max-width:360px"><span>Find a candidate</span><input class="in" id="plq" data-f="plq" placeholder="Name or client" value="${esc(U.plQ)}"></label>${plChips()}`}
function plSummary(all){
  const act=all.filter(isActive),w2=act.filter(c=>c.pt==='W2').length,pm=PM();

function oc(c){const r=calc(c,ZERO),cl=client(c.client),msp=c.bST*cl.msp,load=c.pST*r.L,base=r.n.st-c.pST*(1+r.L)-c.stip,sc=base*cl.scomm/100;
  const parts=[['MSP',msp],[c.pt==='W2'?'Taxes & load':'Load',load],['Stipend',c.stip],['Sales comm.',sc]].filter(x=>Math.abs(x[1])>0.004);return {tot:msp+load+c.stip+sc,parts}}

  ${a.map(c=>{const on=isActive(c),rr=calc(c,ZERO).rr;return `<tr class="click${on?'':' ended'}" data-act="pl-open" data-n="${esc(c.name)}">

   <td>${who(c.rec)}<div class="mut sm1">${c.dl&&c.dl!=='Gone'&&c.dl!==c.rec?'Lead: '+esc(c.dl):''}</div></td>
   ${pm.bill?`<td class="n">${$m(c.bST)}</td>`:''}${pm.pay?`<td class="n">${$m(c.pST)}</td>`:''}${pm.bill&&pm.pay?(()=>{const k=oc(c);return `<td class="n">${$m(k.tot)}<div class="mut sm1">${k.parts.map(([l,v])=>l+' '+$m(v)).join(' · ')}</div></td>`})():''}
   ${pm.margin?`<td class="n"><b class="${rr<0?'lowm':'gainm'}">${$m(rr)}</b></td>`:''}

function candForm(){
  const pm=PM(),isNew=U.plEdit==='new',c=isNew?(U.plDraft||newCand()):(U.plDraft||C[U.plEdit]),e=U.plErr||{};
  if(!c)return '<div class="empty">Candidate not found.</div>';
  const er=id=>e[id]?`<span class="err">${e[id]}</span>`:'';

function mgrCalc(n,k){const P=mgrPeople()[n],pl=mgrPlans()[P.plan],yr=k.endsWith('-Y'),[f,l]=mpRange(k),rows=[];
  S.cands.filter(c=>c[P.f]===n&&c.start>=f&&c.start<=l).forEach(c=>{const six=addD(c.start,42),left=c.end&&c.end<six,ok=!left&&six<=ASOF,rr=calc(c,ZERO).rr;
    rows.push({name:c.name,client:c.client,type:'Contract',start:c.start,from:six,st:left?'Left before 6 weeks':ok?'Counted':'Waiting for 6 weeks',ok,rr})});
  D.fte.forEach(x=>{const w=addD(x.start,60),paid=S.fte[x.name]&&S.fte[x.name].amt>0;if(w<f||w>l)return;const ok=paid&&w<=ASOF;
    rows.push({name:x.name,client:x.client,type:'Perm',start:x.start,from:w,st:!paid?'Fee not paid yet':ok?'Counted':'Waiting for warranty',ok,rr:x.amount/2000,fee:x.amount})});
  const sl=yr?pl.y:pl.q,tot=sum(rows.filter(r=>r.ok),r=>r.rr);let hit=-1;sl.forEach((x,i)=>{if(tot>=x[1])hit=i});
  const base=hit>=0?sl[hit][2]:0,A=(S.mgrX||{})[n+'|'+k.slice(0,4)]||{},ex=yr?sum(pl.ex.filter((e,i)=>A[i]),e=>e[1]):0,end=l;
  const pay=yr?(+k.slice(0,4)+1)+'-02-28':iso(Date.UTC(+end.slice(0,4),+end.slice(5,7)+2,0));
  return {P,pl,yr,rows:rows.sort((a,b)=>a.start.localeCompare(b.start)),sl,tot,hit,base,ex,A,total:base+ex,pay,closed:l<ASOF,next:sl[hit+1]}}

  return {comm:d.comm,html:(d.lines.length?`<div class="plc-list">${cards}</div><div class="row" style="justify-content:space-between;margin-top:8px;font-weight:600"><span>Contract placements · ${d.lines.length}</span><span>${cmR(d.comm-(d.permC||0))}</span></div>`:'<div class="sm-t">No contract placements with hours this month.</div>')+permH+(d.permC?`<div class="row" style="justify-content:space-between;margin-top:10px;font-weight:600"><span>Total this month (contract + perm)</span><span>${cmR(d.comm)}</span></div>`:'')+

function leadDetail(L,mon){const T=teamOf(),pc=leadPct(L),data=commission(mon),team=[...new Set(S.cands.map(c=>c.rec))].filter(R=>R&&T[R]===L&&R!==L),rows=team.map(R=>{const d=data.find(x=>x.R===R);return {R,c:d?d.comm:0,n:d?d.lines.length:0}}),tot=sum(rows,x=>x.c);

const recM=(R,m)=>{const x=commission(m).find(z=>z.R===R);return x?{c:x.comm,n:x.lines.length,sp:x.spread}:{c:0,n:0,sp:0}};

  const people=()=>{const m=[];[...new Set(S.cands.map(c=>c.rec))].filter(x=>x&&x!=='Gone').forEach(n=>m.push([n,'rec']));LEADS().forEach(n=>m.push([n,'dl']));Object.keys(scPeople()).forEach(n=>m.push([n,'sp']));Object.keys(mgrPeople()).forEach(n=>m.push([n,'mgr']));return m};

  if(types.includes('sp')&&P==='m'){const q=qOfM(U.myM),x=scStmt(who,q),m=U.myM,acc=x.rows.filter(r2=>r2.due.slice(0,7)===m),hs=x.hires.slice().sort((a2,b2)=>a2.start.localeCompare(b2.start)),mine=hs.map((c,i)=>({c,n:i+1})).filter(z=>z.c.start.slice(0,7)===m),addAmt=z=>qbAmt(x.pl,z.n)-qbAmt(x.pl,z.n-1),tot=sum(acc,r2=>r2.amt)+sum(mine,addAmt);

function mailBody(k){
  if(k==='overdue'){const o=L.filter(l=>!l.t.rcvd&&l.due<ASOF&&l.r.bill>0),g={};o.forEach(l=>{const x=g[l.c.client]=g[l.c.client]||{n:0,amt:0,old:l.due};x.n++;x.amt+=l.r.bill;if(l.due<x.old)x.old=l.due});const r=Object.entries(g).sort((a,b)=>b[1].amt-a[1].amt);
    return [`${o.length} invoices overdue · ${$m(sum(o,l=>l.r.bill),0)}`,`<p>Good morning,</p><p>These client invoices are past their due date as of ${fd(ASOF)}:</p><table><thead><tr><th>Client</th><th class="n">Invoices</th><th class="n">Amount</th><th class="n">Oldest due</th></tr></thead><tbody>${r.map(([c,x])=>`<tr><td>${esc(c)}</td><td class="n">${x.n}</td><td class="n">${$m(x.amt)}</td><td class="n">${fd(x.old)}</td></tr>`).join('')}</tbody></table><p>Full list attached (Excel).</p>`]}
  if(k==='missing'){const m=activeIn(LAST_WK).filter(c=>!hasHours(c.name,LAST_WK));return [`${m.length} timesheets missing for week ending ${fds(LAST_WK)}`,`<p>Hi,</p><p>No hours have been entered yet for:</p><ul>${m.map(c=>`<li>${esc(c.name)} · ${esc(c.client)} (DM ${esc(c.dm)})</li>`).join('')||'<li>Nobody, all done.</li>'}</ul><p>Please get these filled in today so invoices go out on time.</p>`]}
  if(k==='payroll'){const d=U.adpD||U.payDate,rs=adpRows(d);return [`Payroll file ready · pay date ${fd(d)}`,`<p>Hi Payroll team,</p><p>The ADP file for pay date <b>${fd(d)}</b> is ready: ${rs.length} employees, ${$n(sum(rs,x=>x.h[0]))} regular and ${$n(sum(rs,x=>x.h[1]))} overtime hours.</p><p>The CSV is attached; upload it in ADP.</p>`]}
  if(k==='comm')return ['Your commission statement · '+monLabel(U.mon),`<p>Hi,</p><p>Your commission statement for ${monLabel(U.mon)} is attached, with each placement and how the amount is worked out.</p>`];
  if(k==='wc')return ["Workers' Comp payroll report · "+(U.wcQ||'Q2 2026'),`<p>Hello,</p><p>Attached is Generis Tek's payroll and revenue by state for ${U.wcQ||'Q2 2026'}.</p>`];
  return ['Portal sync failed · SAP Fieldglass','<p>The Monday sync could not log in to SAP Fieldglass (password expired). Please update the saved login.</p>']}
V.email=()=>{
  const m=mail(),ed=role().kind==='admin'||role().kind==='finance';
  const conn=(k,nm,sub)=>`<div class="card pad conn"><div><b>${nm}</b><div class="sm-t">${sub}</div></div><div class="row">${m[k]?pill('Connected','good'):pill('Not connected','')}${ed?`<button class="btn sm ${m[k]?'':'pri'}" data-act="ml-conn" data-v="${k}">${m[k]?'Disconnect':'Connect (demo)'}</button>`:''}</div></div>`;
  let dr='';if(U.mlDr){const r=RULESM.find(x=>x[0]===U.mlDr),[sub,b]=mailBody(U.mlDr);dr=drawer('Email preview',esc(r[1])+' · '+esc(r[2]),`<div class="mail"><div class="mh"><span class="sm-t">From: Generis Tek Billing &lt;${esc(m.from)}&gt;</span><span class="sm-t">To: ${esc(r[3])}</span><b>${esc(sub)}</b></div>${b}</div>${ed?`<button class="btn pri" data-act="ml-send" data-v="${r[0]}" ${m.ms||m.gm?'':'disabled'}>Send test now</button>${m.ms||m.gm?'':'<div class="sm-t">Connect an email account first.</div>'}`:''}`,'ml-close')}
  return head('Email & alerts',"Reports and reminders sent automatically from Generis Tek's own Microsoft 365 (Outlook) mailbox, so they don't land in spam.")+
  `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${conn('ms','Microsoft 365 (Outlook)','Live sending. Generis Tek IT admin approves our app once.')}${conn('gm','Test Gmail account','Used while testing, before going live.')}</div>
  <section class="card pad">${fld('Send from',`<input class="in" style="max-width:340px" data-f="mlfrom" value="${esc(m.from)}" ${ed?'':'disabled'}>`)}</section>
  <section class="card"><div class="tbl"><table><thead><tr><th>On</th><th>Email</th><th>When</th><th>Sent to</th><th></th></tr></thead><tbody>${RULESM.map(([k,n,w,to])=>`<tr><td><input type="checkbox" data-f="mlon" data-k="${k}" ${m.on[k]?'checked':''} ${ed?'':'disabled'} aria-label="Turn ${esc(n)} on or off"></td><td class="nm">${esc(n)}</td><td>${esc(w)}</td><td class="sm-t">${esc(to)}</td><td><button class="btn sm" data-act="ml-prev" data-v="${k}">Preview</button></td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><div class="pad"><h3 style="font-size:15px">Sent log</h3></div>${m.log.length?`<table><thead><tr><th>When</th><th>Email</th><th>Via</th></tr></thead><tbody>${m.log.slice().reverse().map(x=>`<tr><td>${esc(x.t)}</td><td>${esc(x.s)}</td><td>${esc(x.v)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nothing sent yet. Open a preview and press “Send test now”.</div>'}</section>`+dr};
Object.assign(ACT,{'ml-conn':d=>{const m=mail();m[d.v]=!m[d.v];save();render()},'ml-prev':d=>{U.mlDr=d.v;render()},'ml-close':()=>{U.mlDr=null;render()},
 'ml-send':d=>{const m=mail(),[s]=mailBody(d.v);m.log.push({t:new Date().toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}),s,v:m.ms?'Microsoft 365':'Test Gmail'});save();U.mlDr=null;render()}});

/* ---------- 8. Access control (role permissions) ---------- */
const lvl=(k,p)=>{const a=S.acl&&S.acl[k];if(a&&a[p])return a[p];return BASE[k].nav.includes(p)?(['exec','rec'].includes(k)?'view':'edit'):'none'};
V.access=()=>{
  const ed=role().kind==='admin',ks=KINDS.filter(([k])=>k!=='admin');
  const cell=(k,p)=>p==='home'?'<span class="sm-t">always</span>':ed?`<select class="in" data-f="acl" data-k="${k}" data-p="${p}" aria-label="${esc(KLBL[k])} – ${esc(NAVLBL[p])}">${['none','view','edit'].map(v=>`<option value="${v}" ${lvl(k,p)===v?'selected':''}>${{none:'—',view:'View',edit:'Edit'}[v]}</option>`).join('')}</select>`:{none:'—',view:'View',edit:'Edit'}[lvl(k,p)];
  const flag=(k,f)=>ed?`<input type="checkbox" data-f="aclf" data-k="${k}" data-p="${f}" ${PERMS[k][f]?'checked':''} aria-label="${esc(KLBL[k])} ${f}">`:(PERMS[k][f]?'✓':'—');
  return head('Access control','Who can open each page, and whether they can only look or also change things. Rate and profit columns are hidden from anyone not ticked below.',ed?'<button class="btn" data-act="acl-reset">Restore defaults</button>':'')+
  `<div class="banner">Admin always has full access. Changes apply immediately: switch “Viewing as” at the top to check what a role sees.</div>
  <section class="card"><div class="tbl"><table class="mx"><thead><tr><th>Page</th>${ks.map(([k,l])=>`<th style="white-space:normal;min-width:96px">${esc(l)}</th>`).join('')}</tr></thead><tbody>
  ${ALLNAV.map(p=>`<tr><td class="nm">${esc(NAVLBL[p])}</td>${ks.map(([k])=>`<td>${cell(k,p)}</td>`).join('')}</tr>`).join('')}
  <tr class="wsub"><td colspan="${ks.length+1}">Data inside pages</td></tr>
  ${[['bill','See bill rates & invoices'],['pay','See pay rates'],['margin','See profit & margin']].map(([f,l])=>`<tr><td>${l}</td>${ks.map(([k])=>`<td>${flag(k,f)}</td>`).join('')}</tr>`).join('')}
  <tr><td>Which records</td>${ks.map(([k])=>`<td class="sm-t" style="white-space:normal">${esc(PERMS[k].scope)}</td>`).join('')}</tr>
  </tbody></table></div></section>
  <div class="sm-t">“View” lets a person open the page without changing anything. People are added and given a role on the Users & roles page.</div>`};
Object.assign(ACT,{'acl-reset':()=>{delete S.acl;delete S.aclF;applyAcl();save();render()}});

/* ---------- events for the add-on pages ---------- */
document.addEventListener('change',e=>{const el=e.target,f=el.dataset.f;if(!f)return;let go=true;
  if(f==='mtn'){const v=el.value.trim(),hit=C[v]?v:(S.cands.find(c=>(c.name+' '+c.client).toLowerCase().includes(v.toLowerCase()))||{}).name;if(v&&hit){U.mtN=hit;U.mtSt=null}else{el.value=U.mtN;go=false}}else if(f==='mtm')U.mtM=el.value;else if(f==='mtst')U.mtSt=el.value;
  else if(f==='mtd'){S.daily=S.daily||{};const v=parseFloat(el.value);S.daily[el.dataset.k]=v>0?Math.min(24,v):0;save()}
  else if(f==='mttv'){S.tday=S.tday||{};if(el.value==='1')S.tday[el.dataset.k]=1;else delete S.tday[el.dataset.k];save()}
  else if(f==='mtvw')U.mtVw=el.value;
  else if(f==='mtx'){S.dx=S.dx||{};const ks=el.dataset.k.split('|'),q=ks.pop(),k=ks.join('|'),v=parseFloat(el.value);S.dx[k]=S.dx[k]||{};if(v>0)S.dx[k][q]=Math.min(24,v);else delete S.dx[k][q];save()}
  else if(f==='pdn')U.pdN=el.value;else if(f==='pdw')U.pdW=el.value;else if(f==='pdloc'){pdA()[U.pdN].loc=el.value;save()}
  else if(f==='pdx'){U.pdX=Object.assign({nights:7,days:7,travel:2},U.pdX||{},{[el.dataset.k]:Math.max(0,Math.min(7,parseInt(el.value)||0))})}
  else if(f==='pdadd'){U.pdAdd=el.value;go=false}else if(f==='pdaddloc'){U.pdAddLoc=el.value;go=false}
  else if(f==='adpd')U.adpD=el.value;else if(f==='adpf')U.adpF=el.value;else if(f==='adpco'){S.adpCo=el.value.trim().toUpperCase()||'GTK';save()}
  else if(f==='wcq')U.wcQ=el.value;else if(f==='scm')U.scM=el.value;
  else if(f==='scp'){const v=parseFloat(el.value);if(v>=0){scP()[el.dataset.k]=v;save()}}
  else if(f==='scpl'){const v=parseFloat(el.value);if(v>=0){const ks=el.dataset.k.split('.');let o=scPlans()[U.scPl];while(ks.length>1)o=o[ks.shift()];o[ks[0]]=v;save()}}
  else if(f==='scpn'){scPlans()[U.scPl].name=el.value.trim()||'Plan';save()}else if(f==='scpnote'){scPlans()[U.scPl].note=el.value.trim();save()}
  else if(f==='scpp'){scPeople()[el.dataset.k].plan=el.value;save()}
  else if(f==='scfs'||f==='scov'){const [n,c]=el.dataset.k.split('|'),x=scPeople()[n].clients[c],v=parseFloat(el.value);if(f==='scfs'){x.fs=v>=0?v:0}else{if(el.value===''||!(v>=0))delete x.amt;else x.amt=v}save()}
  else if(f==='mgpl'){const v=parseFloat(el.value);if(v>=0){const ks=el.dataset.k.split('.');let o=mgrPlans()[el.dataset.p];while(ks.length>1)o=o[ks.shift()];o[+ks[0]]=v;save()}}
  else if(f==='mgas'){S.mgrA=S.mgrA||{};S.mgrA[el.dataset.k]=el.value;save()}
  else if(f==='mgn')U.mgN=el.value;else if(f==='mgk')U.mgK=el.value;
  else if(f==='mgx'){S.mgrX=S.mgrX||{};const k=el.dataset.k;S.mgrX[k]=S.mgrX[k]||{};S.mgrX[k][el.dataset.i]=el.checked?1:0;save()}
  else if(f==='mspx'){const m=mspList().find(x=>x.id===el.dataset.id);if(m){const k=el.dataset.k;m[k]=['spend','vendors'].includes(k)?Math.max(0,parseFloat(el.value)||0):el.value;if(k==='vendors'&&m.vendors<1)m.vendors=1;save()}}
  else if(f==='mspq'){U.mspQ=el.value}
  else if(f==='pdc'){const c=pdCfg(),k=el.dataset.k;if(el.type==='checkbox')c[k]=el.checked;else if(k==='key'){if(el.value)c.key='set'}else if(el.type==='number')c[k]=Math.max(0,parseFloat(el.value)||0);else c[k]=el.value;save()}
  else if(f==='gsaq2'){U.gsaQ2=el.value;U.gsaN=30}else if(f==='gsast'){U.gsaSt=el.value;U.gsaN=30}else if(f==='gsam'){U.gsaMi=+el.value}
  else if(f==='pdtl'){pdA()[el.dataset.k].loc=el.value;save()}
  else if(f==='pdt'){const t=pdCfg().tiers[+el.dataset.i];t[+el.dataset.j]=Math.max(0,parseFloat(el.value)||0);pdCfg().tiers.sort((a,b)=>a[0]-b[0]);save()}
  else if(f==='payq'){U.payN=null;U.payQ=el.value.trim()}else if(f==='payv'){U.payV=el.value;U.payP=null}else if(f==='payp')U.payP=el.value;
  else if(f==='otc'){const r=OTC().st[el.dataset.s],k=el.dataset.k;if(r){if(el.type==='checkbox')r[k]=el.checked?1:0;else if(k==='note')r.note=el.value;else r[k]=Math.max(0,parseFloat(el.value)||0);otSync();save()}}
  else if(f==='otf'){OTF()[el.dataset.k]=Math.max(0,parseFloat(el.value)||0);save()}else if(f==='otadd'){U.otAdd=el.value;go=false}
  else if(f==='invm'){U.invM=el.value;U.invMv=null}else if(f==='invmq')U.invMQ=el.value;
  else if(f==='fx'){const v=parseFloat(el.value);if(v>0){S.fx=v;save()}}
  else if(f==='rpx'){const pl=recPlans()[el.dataset.p];if(pl){const ks=el.dataset.k.split('.');if(ks[0]==='name'||ks[0]==='note')pl[ks[0]]=el.value;else{const v=Math.max(0,parseFloat(el.value)||0);let o=pl;while(ks.length>1)o=o[ks.shift()];o[ks[0]]=v}save()}}
  else if(f==='rpa'){S.recA=S.recA||{};S.recA[el.dataset.k]=el.value;save()}
  else if(f==='lcq'){U.lcQ=el.value}
  else if(f==='leadpctby'){const v=parseFloat(el.value);if(v>=0&&v<=100){S.leadPctBy=S.leadPctBy||{};S.leadPctBy[el.dataset.k]=v;save()}}
  else if(f==='leadpct'){const v=parseFloat(el.value);if(v>=0&&v<=100){S.leadPct=v;save()}}
  else if(f==='team'){teamOf();if(el.value)S.team[el.dataset.k]=el.value;else delete S.team[el.dataset.k];save()}
  else if(f==='roa'){if(U.roD)U.roD.acl[el.dataset.k]=el.value;go=false}else if(f==='rof'){if(U.roD)U.roD.f[el.dataset.k]=el.checked?1:0;go=false}
  else if(f==='mym')U.myM=el.value;else if(f==='myy')U.myY=el.value;else if(f==='myq')U.myQ=el.value;else if(f==='myn')U.myN=el.value;
  else if(f==='crp')U.crP=el.value;
  else if(f==='scq')U.scQ=el.value;else if(f==='scsp')U.scN=el.value;else if(f==='scaddc')go=false;
  else if(f==='mlon'){mail().on[el.dataset.k]=el.checked?1:0;save()}else if(f==='mlfrom'){mail().from=el.value.trim();save()}
  else if(f==='acl'){S.acl=S.acl||{};const k=el.dataset.k;if(!S.acl[k]){S.acl[k]={};ALLNAV.forEach(p=>S.acl[k][p]=lvl(k,p))}S.acl[k][el.dataset.p]=el.value;applyAcl();save()}
  else if(f==='aclf'){S.aclF=S.aclF||{};const k=el.dataset.k;S.aclF[k]=S.aclF[k]||{};S.aclF[k][el.dataset.p]=el.checked?1:0;applyAcl();save()}
  else go=false;
  if(go)render()});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.f==='mtn')e.target.select()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(U.vmDr!=null||U.mlDr)){U.vmDr=null;U.mlDr=null;render()}});
window.addEventListener('hashchange',()=>{U.vmDr=null;U.mlDr=null;if(location.hash!=='#users'){U.usEd=null;U.usDraft=null;U.usErr=null}});
render();
})();
</script>
