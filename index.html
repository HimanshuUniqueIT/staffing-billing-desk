<style>

:root{

:root{color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}

a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.app{display:flex;min-height:100%}
.side{flex:0 0 232px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:14px}
.brand b{font-family:var(--f-head);font-size:16px}
.brand small{display:block;color:var(--muted);font-size:11.5px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14px}
#nav a:hover{background:var(--soft)}
#nav a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
#nav .cnt{font-size:11.5px;background:var(--bad-bg);color:var(--bad);border-radius:99px;padding:1px 7px;font-weight:600}
.mainwrap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.top .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top label{font-size:12px;color:var(--muted)}
main{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head h1{font-size:26px}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.split{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.split>.wide{flex:3 1 560px;min-width:0}
.split>.narrow{flex:1 1 280px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px}
.tile{padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.tile .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .val{font-family:var(--f-head);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12.5px;color:var(--muted)}
.tile.alert{border-color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.in,select.in{min-height:36px;border:1px solid var(--line);border-radius:7px;padding:0 10px;background:var(--panel);width:100%}
.in.h{width:64px;text-align:right;padding:0 8px;min-height:32px;font-variant-numeric:tabular-nums}
.in.h[readonly]{background:var(--soft);border-color:transparent}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto}
.clist td{padding:10px 12px}.sm1{font-size:12px;margin-top:2px}.clist tr.ended td{color:var(--muted)}.lowm{color:var(--bad)}.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-bottom:-4px}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.terms>div{background:var(--soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}.terms span,.terms small{color:var(--muted);font-size:12px}.terms b{font-size:18px;font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column;gap:14px}.step{display:flex;gap:12px;align-items:flex-start;line-height:1.55}.step>div{flex:1;min-width:0}.step .no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:13px}
table.calc{width:auto;min-width:min(100%,520px)}
.sum{margin-top:8px;max-width:520px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.sum>div{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.sum>div:last-child{border-bottom:0}.sum .tot{background:var(--accent-soft)}
.calcc{line-height:1.6;font-variant-numeric:tabular-nums;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 18px}.facts>div{display:flex;flex-direction:column;gap:3px}.facts span{font-size:12px;color:var(--muted)}.facts small{font-size:11.5px;color:var(--muted)}
.csec{padding:16px}.csec h3{font-size:15px;margin-bottom:8px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px;align-items:start}
.cr{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,1.6fr) auto;gap:4px 12px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline;font-variant-numeric:tabular-nums}
.cr:last-child{border-bottom:0}.cr .l{font-weight:500}.cr .h{color:var(--muted);font-size:12.5px}.cr b{text-align:right;white-space:nowrap}
.cr.zero{opacity:.45}.cr.tot{background:var(--soft);margin:2px -8px;padding:8px;border-radius:6px;border-bottom:0}.cr.tot.good b{color:var(--good)}
.wnote{margin-top:10px;font-size:12.5px;color:var(--warn);background:var(--warn-bg);padding:8px 10px;border-radius:6px}
.wkbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
@media (max-width:560px){.cr{grid-template-columns:1fr auto}.cr .h{grid-column:1/-1;order:3}}
.dr-bg{position:fixed;inset:0;background:rgba(15,25,35,.35);z-index:40;animation:fd .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);max-width:100%;box-sizing:border-box;background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);animation:sl .2s ease-out}
.dr-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px;background:var(--panel);border-bottom:1px solid var(--line)}.dr-h h2{font-size:19px}
.dr-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.dr-b{flex:1;overflow:auto;padding:16px 18px 28px;display:flex;flex-direction:column;gap:14px}
@keyframes sl{from{transform:translateX(40px);opacity:0}}@keyframes fd{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.drawer,.dr-bg{animation:none}}
.tabs .chip{padding:7px 16px;font-size:13.5px}
.ptab table{font-size:12.5px}.ptab th{white-space:normal;min-width:62px;vertical-align:bottom;line-height:1.2}
.ptab td{padding:6px 8px;white-space:nowrap}.ptab tr.wkr td{border-bottom:1px dashed var(--line)}.ptab tr.ptot td{background:var(--soft);border-bottom:2px solid var(--line)}
.ptab .z{color:var(--muted);opacity:.55}.ptab th:nth-child(2),.ptab td:nth-child(2){position:sticky;left:0;background:var(--panel);z-index:1}.ptab tr.ptot td:nth-child(2){background:var(--soft)}.ptab th:nth-child(2){z-index:3}
.pdbar{display:flex;flex-wrap:wrap;gap:12px 32px;background:var(--accent-soft);border-radius:8px;padding:10px 14px}.pdbar>div{display:flex;flex-direction:column;gap:2px}.pdbar b{font-size:15px}
.drawer.wide-dr{width:min(820px,100%)}
.mgrid td,.mgrid th{text-align:center}.mgrid td.hit{background:var(--good-bg);color:var(--good);font-weight:700;outline:2px solid var(--good);outline-offset:-2px}
.bandrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.bandtot{background:var(--accent-soft)!important;border:1px solid var(--accent)}.bandwk{background:var(--soft);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.cmtab th:nth-child(1),.cmtab td:nth-child(1){position:sticky;left:0;background:var(--panel);z-index:1}.cmtab th:nth-child(2),.cmtab td:nth-child(2){position:static}.cmtab tr.ptot td:nth-child(1){background:var(--soft)}

.drawer .cr{grid-template-columns:1fr auto;gap:2px 16px;padding:9px 0}
.drawer .cr .l{grid-column:1;grid-row:1}.drawer .cr b{grid-column:2;grid-row:1}.drawer .cr .h{grid-column:1/-1;grid-row:2;text-align:left;font-size:12.5px}
.drawer .cr .h:empty{display:none}
.drawer .cr.tot{margin:4px -10px;padding:10px}
.drawer .csec h3{font-size:15px;padding-bottom:6px;border-bottom:2px solid var(--line);margin-bottom:2px}
.dr-h,.dr-nav{padding-left:20px;padding-right:20px}.dr-b{padding-left:20px;padding-right:20px}
.in.h.tsn{width:84px;text-align:left}.in.h.exp{width:76px}.in.h.need{border-color:var(--bad);background:var(--bad-bg)}
.req{color:var(--bad);font-weight:600}.gainm{color:var(--good)}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}
.lnk:hover{text-decoration:underline}

td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tfoot td{font-weight:600;border-bottom:0;border-top:2px solid var(--line)}
tr.sel td{background:var(--accent-soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.nm{font-weight:600}
.sm-t{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.li:hover{background:var(--soft)}
.li.sel{background:var(--accent-soft)}
.note{border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--ink);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px}
.math{font-size:13px;display:flex;flex-direction:column;gap:3px}

.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
svg .gl{stroke:var(--gl)} svg .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}

.chartbox{overflow-x:auto}

.empty{padding:28px;text-align:center;color:var(--muted)}

.lock{font-size:12.5px;color:var(--good);font-weight:600}
.mut{color:var(--muted)}
.err{color:var(--bad);font-size:12px;font-weight:600}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fsec{display:flex;flex-direction:column;gap:10px}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function client(n){const b=D.clients.concat(S.xc||[]).find(c=>c.name===n)||{name:n,msp:0,otx:1,dtx:1,terms:30,scomm:0};return Object.assign({},b,S.clients[n]||{})}
function calc(c,t){
  const cl=client(c.client), L=(S.load[c.pt]??20)/100, k=1-cl.msp;
  const [st,ot,hol,on,cb,dt,pto]=t.h;
  const n={st:c.bST*k,ot:c.bOT*k,hol:c.bHol*k,on:c.bOn*k,cb:c.bCb*k};
  const billST=st*n.st, bill=billST+ot*n.ot+hol*n.hol+on*n.on+cb*n.cb+dt*n.hol;
  const payST=st*c.pST, stipAmt=st*c.stip, pay=payST+ot*c.pOT+hol*c.pHol+on*c.pOn+cb*c.pCb+stipAmt;
  const gp=billST-payST*(1+L), adj=gp*(1-cl.scomm/100);
  const rr=(n.st-(c.pST*(1+L)+c.stip))*(1-cl.scomm/100);
  return {bill,billST,pay,payST,stipAmt,gp,adj,gpm:billST?gp/billST*100:0,rr,spread:rr*(st-pto),msp:cl.msp,terms:cl.terms,n,L,hours:st+ot+hol+on+cb+dt};
}
function payDate(c,wk,terms){if(c.pt==='CTOC')return addD(eom1(wk),terms);if(c.weekly)return addD(wk,12);return D.cal[wk]||addD(wk,19)}
function line(name,wk){const c=C[name],t=S.ts[name+'|'+wk];const r=calc(c,t);return {k:name+'|'+wk,name,wk,c,t,r,due:addD(wk,r.terms),pd:payDate(c,wk,r.terms)}}
function allLines(){const out=[];for(const k in S.ts){const i=k.indexOf('|'),name=k.slice(0,i),wk=k.slice(i+1);if(!C[name])continue;const l=line(name,wk);if(l.r.hours>0||l.t.rcvd)out.push(l)}return out}
function ar(l){
  const bill=l.r.bill;if(bill<=0.004)return null;
  const rc=l.t.rcvd, got=rc?(rc.amt==null?bill:rc.amt):0, bal=Math.max(0,bill-got);
  let st=rc?(bal<=0.01?'Paid':'Short paid'):(l.due<ASOF?'Overdue':'Open');
  return {bill,got,bal,st,late:(st==='Overdue'||st==='Short paid')?Math.max(0,dd(ASOF,l.due)):0};
}
const hasHours=(n,w)=>{const t=S.ts[n+'|'+w];return !!(t&&t.h.some(x=>x>0))};
const activeIn=w=>S.cands.filter(c=>inScope(c)&&c.start<=w&&(!c.end||c.end>=addD(w,-6)));
const isActive=c=>!c.end||c.end>=ASOF;
function bandIdx(v){let i=0;D.grid.spread.forEach((s,j)=>{if(v>=s)i=j});return i}
function tierIdx(v){let i=0;D.grid.gpTiers.forEach((s,j)=>{if(v>=s)i=j});return i}
function commission(mon){
  const wks=WEEKS.filter(w=>w.slice(0,7)===mon);
  const recs=[...new Set(S.cands.map(c=>c.rec))].filter(r=>r&&r!=='Gone').sort();
  return recs.map(R=>{
    const lines=S.cands.filter(c=>c.rec===R).map(c=>{
      const per=wks.map(w=>hasHours(c.name,w)?calc(c,S.ts[c.name+'|'+w]):null);
      const rr=calc(c,{h:[0,0,0,0,0,0,0]}).rr;
      const tenure=Math.round(dd(c.end||ASOF,c.start)/7);
      return {c,per,rr,elig:tenure>=6,tenure};
    }).filter(x=>x.per.some(p=>p));
    const weekTot=wks.map((w,i)=>sum(lines,x=>x.per[i]?x.per[i].spread:0));
    const band=weekTot.map(bandIdx);
    lines.forEach(x=>{x.tier=tierIdx(x.rr);x.weeks=x.per.map((p,i)=>p?{spread:p.spread,rate:D.grid.gp[band[i]][x.tier],comm:x.elig?p.spread*D.grid.gp[band[i]][x.tier]*(S.unit==='pct'?0.01:1):0}:null);
      x.spread=sum(x.weeks,w=>w&&w.spread);x.comm=sum(x.weeks,w=>w&&w.comm)});
    return {R,lines,wks,weekTot,band,spread:sum(lines,x=>x.spread),comm:sum(lines,x=>x.comm)};
  }).filter(r=>r.lines.length);
}

    ${pm.bill?`<td><input class="in h tsn" aria-label="Invoice number for ${esc(x.c.name)}" data-f="tsx" data-p="invn" data-k="${esc(x.k)}" value="${esc(t.invn||'')}" placeholder="${pm.editPay?'INV-':''}" ${pm.editPay?'':'readonly'}></td>`:''}

   <tbody>${shown.map(tr).join('')||`<tr><td colspan="12" class="empty">${U.tsQ?'No timesheets match “'+esc(U.tsQ)+'” for this week.':'No placements match this filter for this week.'}</td></tr>`}</tbody>

   <aside class="card pad narrow" id="ts-x">${explain()}</aside></div>`;
};
function totals(rows){let h=0,b=0,p=0,s=0,e=0;rows.forEach(x=>{const t=S.ts[x.k];if(!t)return;const r=calc(x.c,t);h+=r.hours+t.h[6];b+=r.bill;p+=r.pay;s+=r.spread;e+=+t.exp||0});return {h,b,p,s,e}}
function explain(){
  const k=U.tsSel;if(!k)return '<div class="empty">Pick a row to see how it is worked out.</div>';
  const i=k.indexOf('|'),name=k.slice(0,i),wk=k.slice(i+1),c=C[name],t=S.ts[k]||{h:[0,0,0,0,0,0,0]},r=calc(c,t),pm=PM();
  const [st,ot,hol,on,cb]=t.h;let h=`<h2 style="font-size:16px">How this row is worked out</h2><div class="sm-t" style="margin:2px 0 10px">${esc(name)} · ${esc(c.client)} · week ending ${fd(wk)}</div><div class="math"><div><span>Timesheet #</span><span>${t.tsn?esc(t.tsn):'<span class="err">missing</span>'}</span></div>${pm.bill?`<div><span>Invoice #</span><span>${t.invn?esc(t.invn):'<span class="mut">not invoiced yet</span>'}</span></div>`:''}${t.exp?`<div><span>Expense (recorded, not added to the bill, as in sheet)</span><span>${$m(+t.exp)}</span></div>`:''}<div style="height:8px"></div>`;
  if(pm.bill){h+=`<div><span>${$n(st)} h × ${$m(c.bST)} less ${(r.msp*100).toFixed(2)}% MSP</span><span>${$m(st*r.n.st)}</span></div>`;
    if(ot)h+=`<div><span>${$n(ot)} h overtime × ${$m(r.n.ot)}</span><span>${$m(ot*r.n.ot)}</span></div>`;if(hol)h+=`<div><span>${$n(hol)} h holiday × ${$m(r.n.hol)}</span><span>${$m(hol*r.n.hol)}</span></div>`;
    if(on)h+=`<div><span>${$n(on)} h on-call × ${$m(r.n.on)}</span><span>${$m(on*r.n.on)}</span></div>`;if(cb)h+=`<div><span>${$n(cb)} h call-back × ${$m(r.n.cb)}</span><span>${$m(cb*r.n.cb)}</span></div>`;if(t.h[5])h+=`<div><span>${$n(t.h[5])} h double time × ${$m(r.n.hol)} (holiday rate, as in sheet)</span><span>${$m(t.h[5]*r.n.hol)}</span></div>`;
    h+=`<div class="tot"><span>Bill to ${esc(c.client)}</span><span>${$m(r.bill)}</span></div><div><span>Invoice due (${r.terms} days)</span><span>${fd(addD(wk,r.terms))}</span></div><div style="height:8px"></div>`}
  if(pm.pay){h+=`<div><span>${$n(st)} h × ${$m(c.pST)} pay</span><span>${$m(r.payST)}</span></div>`;if(ot)h+=`<div><span>${$n(ot)} h overtime × ${$m(c.pOT)}</span><span>${$m(ot*c.pOT)}</span></div>`;
    if(on)h+=`<div><span>${$n(on)} h on-call × ${$m(c.pOn)}</span><span>${$m(on*c.pOn)}</span></div>`;if(c.stip)h+=`<div><span>${$n(st)} h × ${$m(c.stip)} stipend</span><span>${$m(r.stipAmt)}</span></div>`;
    h+=`<div class="tot"><span>Pay to ${esc(name.split(' ')[0])}</span><span>${$m(r.pay)}</span></div><div><span>Pay date</span><span>${fd(payDate(c,wk,r.terms))}</span></div><div style="height:8px"></div>`}
  if(pm.margin){h+=`<div><span>Profit per hour</span><span>${$m(r.rr)}</span></div><div><span>Weekly spread (× ${$n(st-t.h[6])} h)</span><span>${$m(r.spread)}</span></div><div><span>Gross profit, sheet rule</span><span>${$m(r.gp)} · ${pct(r.gpm)}</span></div>`;
    if(c.stip)h+=`<div class="note" style="margin-top:8px">The sheet's gross profit leaves out the ${$m(r.stipAmt)} stipend. Spread includes it.</div>`}
  return h+'</div>';
}

  'fte-pay':d=>{const f=D.fte.find(x=>x.name===d.n);S.fte[d.n]={date:ASOF,amt:f.amount};save();render()},
  'pay-tab-old':d=>{if(d.v==='run')U.payTab='run';else{U.payTab='period';U.pyMode=d.v}U.pyDr=false;render()},'py-mode':d=>{U.pyMode=d.v;U.pyDr=false;render()},'py-basis':d=>{U.pyBasis=d.v;render()},'py-t':d=>{U.pyT=d.v;render()},'py-rows':d=>{U.pyRows=d.v;render()},

  'rec-sel':d=>{U.recSel=d.v;render()},
  'cl-new':()=>{U.clEd='new';U.clErr=null;U.clDraft=null;U.clDelC=false;render();const i=document.getElementById('clf-name');if(i)i.focus()},'cl-edit':d=>{U.clEd=d.n;U.clErr=null;U.clDraft=null;U.clDelC=false;render()},'cl-close':()=>{U.clEd=null;U.clErr=null;U.clDraft=null;render()},
  'cl-del':()=>{if(!U.clDelC){U.clDelC=true;render();return}S.xc=S.xc.filter(x=>x.name!==U.clEd);delete S.clients[U.clEd];save();U.clEd=null;U.clDelC=false;render()},

  'reset':()=>{if(!U.confirmReset){U.confirmReset=true;render();setTimeout(()=>{U.confirmReset=false;render()},4000);return}const r=S.role;S=fresh();S.role=r;reC();seedHistory();U.confirmReset=false;save();render()}
};
if(typeof document!=='undefined'){
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(U.invDr||U.fteDr||U.pyDr||U.cmDr||U.clEd)){U.invDr=false;U.fteDr=false;U.pyDr=false;U.cmDr=false;U.clEd=null;render();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.li[data-act]')){e.preventDefault();ACT[e.target.dataset.act](e.target.dataset)}});
document.addEventListener('submit',e=>{if(e.target.id==='candf'){e.preventDefault();saveCand();return}if(e.target.id==='clf'){e.preventDefault();saveClient();return}if(e.target.id!=='payf')return;e.preventDefault();const t=S.ts[U.arSel];if(!t)return;const amt=parseFloat(document.getElementById('pay-amt').value);if(!(amt>=0))return;t.rcvd={date:document.getElementById('pay-date').value||ASOF,amt,note:document.getElementById('pay-note').value};save();U.arSel=null;render()});
document.addEventListener('input',e=>{const el=e.target,f=el.dataset.f;
  if(f==='clq'){U.clQ=el.value;render();const q=document.getElementById('clq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  if(f==='tsq'){U.tsQ=el.value;U.tsSel=null;render();const q=document.getElementById('tsq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  if(f==='pyq'){U.pyQ=el.value;render();const q=document.getElementById('pyq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  if(f==='fteq'){U.fteQ=el.value;render();const q=document.getElementById('fteq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  if(f==='invq'){U.invQ=el.value;render();const q=document.getElementById('invq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  if(f==='tsx'){const k=el.dataset.k;let t=S.ts[k];if(!t)t=S.ts[k]={h:[0,0,0,0,0,0,0],exp:0,rcvd:null,status:'draft'};const p=el.dataset.p;if(p!=='invn'&&t.status==='approved')return;t[p]=p==='exp'?Math.max(0,parseFloat(el.value)||0):el.value;save();
    if(p==='tsn')el.classList.toggle('need',!el.value.trim());const tr=el.closest('tr'),b=tr&&tr.querySelector('[data-act="ts-approve"]');if(b)b.disabled=!tsReady(t);if(p==='exp'){const rows=activeIn(U.wk).map(c=>({c,k:c.name+'|'+U.wk})),q=document.getElementById('t-e');if(q)q.textContent=$m(totals(rows).e)}
    U.tsSel=k;const x=document.getElementById('ts-x');if(x)x.innerHTML=explain()}
  if(f==='h'){const k=el.dataset.k;let t=S.ts[k];if(!t)t=S.ts[k]={h:[0,0,0,0,0,0,0],exp:0,rcvd:null,status:'draft'};if(t.status==='approved')return;t.h[+el.dataset.i]=Math.max(0,parseFloat(el.value)||0);save();
    const i=k.indexOf('|'),c=C[k.slice(0,i)],r=calc(c,t),tr=el.closest('tr'),set=(s,v)=>{const x=tr.querySelector(`[data-c="${s}"]`);if(x)x.innerHTML=v};
    set('bill',$m(r.bill));set('pay',$m(r.pay));set('sp',$m(r.spread));set('st',stPill(t.h.some(x=>x>0)?'Draft':'Missing'));{const b=tr.querySelector('[data-act="ts-approve"]');if(b)b.disabled=!tsReady(t);if(el.dataset.i==='0')el.classList.toggle('need',!(t.h[0]>0))}
    const rows=activeIn(U.wk).map(c=>({c,k:c.name+'|'+U.wk})),tt=totals(rows),q=id=>document.getElementById(id);
    if(q('t-h'))q('t-h').textContent=$n(tt.h)+' hours';if(q('t-b'))q('t-b').textContent=$m(tt.b);if(q('t-p'))q('t-p').textContent=$m(tt.p);if(q('t-s'))q('t-s').textContent=$m(tt.s);
    U.tsSel=k;const x=q('ts-x');if(x)x.innerHTML=explain();document.querySelectorAll('tr.sel').forEach(r=>r.classList.remove('sel'));tr.classList.add('sel')}
  if(f==='plq'){U.plQ=el.value;const t=document.getElementById('pl-table');if(t){t.innerHTML=plTable()}else{document.getElementById('pl-list').innerHTML=plList();document.getElementById('pl-d').innerHTML=plDetail()}}
});
document.addEventListener('change',e=>{const el=e.target,f=el.dataset.f;
  if(el.id==='role'){S.role=el.value;save();U.recSel=null;render();return}
  if(f==='wk'){U.wk=el.value;U.tsSel=null;render()}
  if(f==='arc'){U.arC=el.value;render()}
  if(f==='invw'){U.invW=el.value;render()}
  if(f==='payd'){U.payDate=el.value.slice(2);render()}
  if(f==='phm'){U.phMode=el.value;U.pyDr=false;render()}
  if(f==='pywk'){U.pyWk=el.value;render()}
  if(f==='pyfrom'){U.pyFrom=el.value;render()}
  if(f==='pyto'){U.pyTo=el.value;render()}
  if(f==='mon'){U.mon=el.value;render()}
  if(f==='unit'){S.unit=el.value;save();render()}
  if(f==='adp'){S.adp[U.payDate+'|'+el.dataset.n]=el.value===''?null:parseFloat(el.value);save();render()}
  if(f==='chk'){const a=S.check[U.payDate]=S.check[U.payDate]||[];a[+el.dataset.i]=el.checked;save();render()}
  if(f==='load'){const v=parseFloat(el.value);if(v>=0){S.load[el.dataset.k]=v;save()}render()}
  if(f==='cl'){const v=parseFloat(el.value);if(v>=0){const n=el.dataset.n,k=el.dataset.k;S.clients[n]=Object.assign({},S.clients[n]||{},{[k]:k==='msp'?v/100:v});save()}render()}
  if(f==='h')render();
});
window.addEventListener('hashchange',()=>{U.invDr=false;U.fteDr=false;U.pyDr=false;U.cmDr=false;U.clEd=null;render();window.scrollTo(0,0)});
seedHistory();save();render();
}
